<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<title>ごみの日ナビ — Gomi Navi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f4f9f4; --card: #ffffff; --ink: #2d3a2e; --green: #4a9e5c;
    --green-dark: #357a44; --dim: #8aa08c; --warn: #e8a13c; --red: #d9534f;
  }
  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: linear-gradient(170deg, #f4f9f4 0%, #e8f3e9 100%);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; color: var(--ink); padding: 20px;
  }
  .app { width: 100%; max-width: 600px; }
  header { text-align: center; margin: 12px 0 18px; }
  h1 { font-size: 1.8rem; letter-spacing: 1px; }
  .tagline { color: var(--dim); font-size: 0.9rem; margin-top: 4px; }
  .card { background: var(--card); border-radius: 20px; padding: 22px; box-shadow: 0 4px 22px rgba(60, 120, 70, 0.10); margin-bottom: 16px; }
  /* 次の収集 */
  .next-card { text-align: center; background: linear-gradient(160deg, #ffffff 0%, #eef8ef 100%); }
  .next-label { font-size: 0.9rem; color: var(--dim); font-weight: 700; letter-spacing: 1px; }
  .next-title { font-size: 2rem; font-weight: 800; color: var(--green-dark); margin: 8px 0 4px; }
  .next-when { font-size: 1rem; color: var(--ink); }
  .next-count { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 999px; font-weight: 800; font-size: 1.05rem; background: #e2f2e4; color: var(--green-dark); }
  .next-count.today { background: #ffe9c9; color: #a06a10; }
  .next-count.tomorrow { background: #d9ecff; color: #2a5a8a; }
  .badge-row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .day-badge { padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; background: #f0f0f0; color: #999; }
  .day-badge.on { background: #d9f0dc; color: var(--green-dark); }
  .day-badge.today { outline: 3px solid var(--green); }
  /* スケジュール表 */
  .sched-title { font-size: 1rem; font-weight: 800; margin-bottom: 12px; color: var(--green-dark); }
  .cat-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef2ee; }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { flex: 1; font-weight: 700; font-size: 0.95rem; }
  .cat-name small { display: block; font-weight: 400; color: var(--dim); font-size: 0.75rem; }
  .week-toggles { display: flex; gap: 6px; }
  .wk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #d8e2d9; background: #fff; font-size: 0.75rem; font-weight: 700; color: #9aab9c; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .wk.on { background: var(--green); border-color: var(--green); color: #fff; }
  .wk:hover { border-color: var(--green); }
  .month-pattern { display: flex; gap: 4px; margin-top: 4px; }
  .mp { font-size: 0.7rem; padding: 3px 7px; border-radius: 8px; border: 1px solid #d8e2d9; background: #fff; color: #9aab9c; cursor: pointer; font-weight: 700; }
  .mp.on { background: #e2f2e4; border-color: var(--green); color: var(--green-dark); }
  /* 設定 */
  .settings-grid { display: flex; flex-direction: column; gap: 10px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.9rem; }
  .set-row select, .set-row input[type=time] { padding: 8px 12px; border: 2px solid #e2ece3; border-radius: 10px; font-family: inherit; font-size: 0.9rem; color: var(--ink); background: #fff; }
  button.main-btn { font-family: inherit; font-size: 1rem; font-weight: 800; padding: 13px 30px; border: none; border-radius: 999px; cursor: pointer; background: linear-gradient(135deg, #5cb46e, #357a44); color: #fff; box-shadow: 0 4px 14px rgba(74, 158, 92, 0.35); }
  button.sub-btn { font-family: inherit; font-size: 0.9rem; font-weight: 700; padding: 10px 22px; border: none; border-radius: 999px; cursor: pointer; background: #e8f3e9; color: var(--green-dark); }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .note { font-size: 0.78rem; color: var(--dim); margin-top: 10px; line-height: 1.6; }
  footer { text-align: center; color: var(--dim); font-size: 0.78rem; margin: 10px 0 24px; }
  details summary { cursor: pointer; color: var(--green-dark); font-weight: 800; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🗓️ ごみの日ナビ</h1>
    <div class="tagline">Gomi Navi — もう、ごみの日を逃さない。</div>
  </header>

  <!-- 次の収集 -->
  <div class="card next-card">
    <div class="next-label">つぎの収集</div>
    <div class="next-title" id="nextTitle">—</div>
    <div class="next-when" id="nextWhen">—</div>
    <div class="next-count" id="nextCount">—</div>
    <div class="badge-row" id="weekBadges"></div>
  </div>

  <!-- スケジュール -->
  <div class="card">
    <div class="sched-title">📋 収集スケジュール（曜日をタップして設定）</div>
    <div id="catList"></div>
    <div class="note">※ 月パターン（第1・第3など）を使う場合は、下の「月パターン」をタップ。設定は自動で保存されます。</div>
  </div>

  <!-- 通知設定 -->
  <div class="card">
    <details open>
      <summary>🔔 リマインダー設定</summary>
      <div class="settings-grid" style="margin-top: 12px;">
        <div class="set-row">
          <span>前日の夕方に通知</span>
          <select id="notifyTime">
            <option value="17">17:00</option>
            <option value="18">18:00</option>
            <option value="19" selected>19:00</option>
            <option value="20">20:00</option>
            <option value="21">21:00</option>
          </select>
        </div>
        <div class="btn-row" style="margin-top: 6px;">
          <button class="main-btn" id="notifyBtn">通知をオンにする</button>
        </div>
        <div class="note" id="notifyNote">※ アプリを開いている間に、前日の指定時刻になったら通知します。</div>
      </div>
    </details>
  </div>

  <!-- その他 -->
  <div class="card">
    <details>
      <summary>⚙️ その他</summary>
      <div class="settings-grid" style="margin-top: 12px;">
        <div class="btn-row">
          <button class="sub-btn" id="resetBtn">スケジュールを初期設定に戻す</button>
        </div>
        <div class="note">データはこの端末のブラウザにだけ保存されます（localStorage）。どこにも送信されません。</div>
      </div>
    </details>
  </div>

  <footer>ごみの日ナビ — WarriorHacks 2.0 出品作品 / オフラインで動きます</footer>
</div>

<script>
// ===== データモデル =====
// カテゴリ: {id, name, en, color, weekdays: [0-6...], months: [] | [1,2,3,4]}
const DEFAULT_CATS = [
  { id: 'burnable', name: '燃えるごみ', en: 'Burnable', color: '#5cb46e', weekdays: [1, 4], months: [] },
  { id: 'plastic', name: 'プラスチック製容器包装', en: 'Plastics', color: '#4a8fd9', weekdays: [3], months: [] },
  { id: 'paper', name: '紙・布', en: 'Paper & Cloth', color: '#c9a227', weekdays: [2], months: [2, 4] },
  { id: 'nonburnable', name: '燃やせないごみ', en: 'Non-burnable', color: '#d97c4a', weekdays: [2], months: [1, 3] },
  { id: 'hazardous', name: '有害ごみ・電池', en: 'Hazardous', color: '#d9534f', weekdays: [5], months: [1] },
];
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];

let cats = load('gomi-cats') || JSON.parse(JSON.stringify(DEFAULT_CATS));
let notifyHour = parseInt(load('gomi-notify-hour') || '19');

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ===== 次の収集を計算 =====
function nthWeekdayOfMonth(date) { return Math.floor((date.getDate() - 1) / 7) + 1; }

function matchesDay(cat, date) {
  const dow = date.getDay();
  if (!cat.weekdays.includes(dow)) return false;
  if (cat.months && cat.months.length > 0) {
    const nth = nthWeekdayOfMonth(date);
    if (!cat.months.includes(nth)) return false;
  }
  return true;
}

function nextCollections(from) {
  // fromから30日先まで探してカテゴリごとの次回を返す
  const result = {};
  for (let i = 0; i < 31; i++) {
    const d = new Date(from);
    d.setDate(d.getDate() + i);
    d.setHours(0, 0, 0, 0);
    for (const cat of cats) {
      if (!result[cat.id] && matchesDay(cat, d)) {
        result[cat.id] = { date: d, daysAhead: i };
      }
    }
  }
  return result;
}

function fmtDate(d) {
  return `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
}

function render() {
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const nexts = nextCollections(today);

  // いちばん近い収集
  let best = null;
  for (const [id, n] of Object.entries(nexts)) {
    if (!best || n.daysAhead < best.daysAhead) best = { id, ...n };
  }
  const title = document.getElementById('nextTitle');
  const when = document.getElementById('nextWhen');
  const count = document.getElementById('nextCount');
  if (best) {
    const cat = cats.find(c => c.id === best.id);
    title.textContent = cat ? cat.name : '—';
    when.textContent = fmtDate(best.date);
    if (best.daysAhead === 0) { count.textContent = '今日です！'; count.className = 'next-count today'; }
    else if (best.daysAhead === 1) { count.textContent = '明日'; count.className = 'next-count tomorrow'; }
    else { count.textContent = `あと${best.daysAhead}日`; count.className = 'next-count'; }
  }

  // 今日の曜日バッジ
  const badges = document.getElementById('weekBadges');
  badges.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - today.getDay() + i);
    const isToday = i === today.getDay();
    const anyCat = cats.some(c => matchesDay(c, d));
    const b = document.createElement('div');
    b.className = 'day-badge' + (anyCat ? ' on' : '') + (isToday ? ' today' : '');
    b.textContent = WEEK[i];
    badges.appendChild(b);
  }

  // カテゴリリスト
  const list = document.getElementById('catList');
  list.innerHTML = '';
  for (const cat of cats) {
    const row = document.createElement('div');
    row.className = 'cat-row';
    // 名前
    const name = document.createElement('div');
    name.className = 'cat-name';
    // NOTE: cat.name/cat.en are static constants from DEFAULT_CATS (no user input
    // reaches these strings), so this innerHTML cannot carry untrusted content.
    name.innerHTML = cat.name + '<small>' + cat.en + '</small>';
    name.style.color = cat.color;
    row.appendChild(name);
    // 曜日トグル
    const toggles = document.createElement('div');
    toggles.className = 'week-toggles';
    for (let i = 1; i <= 6; i++) {  // 月〜土
      const wk = document.createElement('button');
      wk.className = 'wk' + (cat.weekdays.includes(i) ? ' on' : '');
      wk.textContent = WEEK[i];
      wk.addEventListener('click', () => {
        const idx = cat.weekdays.indexOf(i);
        if (idx >= 0) cat.weekdays.splice(idx, 1); else cat.weekdays.push(i);
        save('gomi-cats', cats);
        render();
      });
      toggles.appendChild(wk);
    }
    row.appendChild(toggles);
    list.appendChild(row);

    // 月パターン
    const mp = document.createElement('div');
    mp.className = 'month-pattern';
    for (let n = 1; n <= 4; n++) {
      const chip = document.createElement('button');
      chip.className = 'mp' + (cat.months.includes(n) ? ' on' : '');
      chip.textContent = '第' + n;
      chip.addEventListener('click', () => {
        const idx = cat.months.indexOf(n);
        if (idx >= 0) cat.months.splice(idx, 1); else cat.months.push(n);
        save('gomi-cats', cats);
        render();
      });
      mp.appendChild(chip);
    }
    const allChip = document.createElement('button');
    allChip.className = 'mp' + (cat.months.length === 0 ? ' on' : '');
    allChip.textContent = '毎週';
    allChip.addEventListener('click', () => {
      cat.months = [];
      save('gomi-cats', cats);
      render();
    });
    mp.appendChild(allChip);
    // 月パターン行をrowの下に
    const wrap = document.createElement('div');
    wrap.style.width = '100%';
    wrap.appendChild(mp);
    row.style.flexWrap = 'wrap';
    row.appendChild(wrap);
  }
}

// ===== 通知 =====
document.getElementById('notifyTime').value = String(notifyHour);
document.getElementById('notifyTime').addEventListener('change', (e) => {
  notifyHour = parseInt(e.target.value);
  save('gomi-notify-hour', notifyHour);
});
document.getElementById('notifyBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) {
    document.getElementById('notifyNote').textContent = 'このブラウザは通知に対応していません。';
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    document.getElementById('notifyNote').textContent = '✅ 通知がオンになりました！前日の' + notifyHour + ':00に通知します（アプリを開いている間）。';
  } else {
    document.getElementById('notifyNote').textContent = '通知が許可されませんでした。ブラウザの設定から許可してください。';
  }
});

// 通知チェック（1分ごと）
setInterval(() => {
  const now = new Date();
  if (now.getHours() !== notifyHour) return;
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(0, 0, 0, 0);
  const hits = cats.filter(c => matchesDay(c, tomorrow));
  if (hits.length && Notification.permission === 'granted') {
    const names = hits.map(c => c.name).join('・');
    new Notification('🗓️ 明日はごみの日です', { body: names + ' の収集があります。' });
  }
}, 60 * 1000);

document.getElementById('resetBtn').addEventListener('click', () => {
  cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
  save('gomi-cats', cats);
  render();
});

render();
</script>
</body>
</html>
